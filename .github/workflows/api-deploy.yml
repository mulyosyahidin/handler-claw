name: Build and Deploy API

on:
  push:
    branches:
      - development
    paths:
      - 'api/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose File to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'api/docker-compose.yml'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JWT_SECRET,DATABASE_URL,DB_PASSWORD,DOCKER_IMAGE
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. Create .env.production
            cat <<EOF > .env.production
            INSTANCE_NAME=mura-vps
            NODE_ENV=production
            APP_PORT=${{ vars.APP_PORT || '3000' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            
            DOCKER_IMAGE=$DOCKER_IMAGE
            JWT_SECRET=${JWT_SECRET//$/$$}
            DATABASE_URL=${DATABASE_URL//$/$$}
            
            DB_HOST=db
            DB_PORT=5432
            POSTGRES_USER=${{ vars.DB_USER }}
            POSTGRES_PASSWORD=${DB_PASSWORD//$/$$}
            POSTGRES_DB=${{ vars.DB_NAME }}
            EOF

            # 2. Permissions
            chmod 600 .env.production
            chmod 600 docker-compose.yml
            
            # 3. Registry Login & Pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $DOCKER_IMAGE
            
            # 4. Database Migration (Prisma)
            echo "🔄 Running Migrations..."
            docker compose --env-file .env.production run --rm handler_claw_api_blue npx prisma migrate deploy
            
            # 5. Update Green Instance (First Target)
            echo "🚀 Starting handler_claw_api_green..."
            docker compose --env-file .env.production up -d handler_claw_api_green
            
            # 6. Strict Health Check Loop
            echo "🔍 Verifying handler_claw_api_green health..."
            count=0
            # Pastikan nama container sesuai dengan container_name di compose
            while [ "$(docker inspect --format='{{.State.Health.Status}}' handler-claw-api-green)" != "healthy" ]; do
              if [ $count -gt 15 ]; then
                echo "❌ Deployment Failed: Green instance is unhealthy."
                docker compose stop handler_claw_api_green
                exit 1
              fi
              echo "⏳ Waiting... ($((count*5))s)"
              sleep 5
              count=$((count+1))
            done
            
            # 7. Update Blue Instance (Primary Target)
            echo "✅ Green is healthy! Updating handler_claw_api_blue..."
            docker compose --env-file .env.production up -d handler_claw_api_blue

            # 8. Reload Nginx Proxy
            echo "🔄 Reloading Nginx Proxy..."
            docker exec proxy-nginx nginx -s reload
            
            # 9. Final Cleanup
            docker image prune -f
            echo "🎉 Deployment Successful"