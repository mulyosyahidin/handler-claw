name: Build and Deploy API

on:
  push:
    branches:
      - development
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose File to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'api/docker-compose.yml'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEFAULT_USER_EMAIL: ${{ secrets.DEFAULT_USER_EMAIL }}
          DEFAULT_USER_NAME: ${{ vars.DEFAULT_USER_NAME || 'Administrator' }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ vars.FIREBASE_CLIENT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          WAG_SECRET: ${{ secrets.WAG_SECRET }}
          WAG_BASE_URL: ${{ vars.WAG_BASE_URL }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_URL: ${{ vars.APP_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JWT_SECRET,DATABASE_URL,DB_PASSWORD,DOCKER_IMAGE,DEFAULT_USER_EMAIL,DEFAULT_USER_NAME,DEFAULT_USER_PASSWORD,FIREBASE_PROJECT_ID,FIREBASE_PRIVATE_KEY,FIREBASE_CLIENT_EMAIL,RESEND_API_KEY,RESEND_FROM_EMAIL,JWT_EXPIRES_IN,WAG_SECRET,WAG_BASE_URL,APP_BASE_URL,API_BASE_URL,APP_URL
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. Create .env
            cat <<'EOF' > .env
            INSTANCE_NAME=mura-vps
            NODE_ENV=production
            APP_PORT=${{ vars.APP_PORT || '3000' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            DOCS_USERNAME=${{ vars.DOCS_USERNAME || 'admin' }}
            DB_HOST=db
            DB_PORT=5432
            TZ=${{ vars.TZ || 'UTC' }}
            EOF

            # Injeksi variabel dinamis
            printf "DOCS_PASSWORD=%s\n" "${{ secrets.DOCS_PASSWORD }}" >> .env
            printf "DOCKER_IMAGE=%s\n" "$DOCKER_IMAGE" >> .env
            printf "JWT_SECRET=%s\n" "$JWT_SECRET" >> .env
            printf "DATABASE_URL=%s\n" "$DATABASE_URL" >> .env
            printf "POSTGRES_USER=%s\n" "${{ vars.DB_USER }}" >> .env
            printf "POSTGRES_PASSWORD=%s\n" "$DB_PASSWORD" >> .env
            printf "POSTGRES_DB=%s\n" "${{ vars.DB_NAME }}" >> .env
            printf "DEFAULT_USER_EMAIL=%s\n" "$DEFAULT_USER_EMAIL" >> .env
            printf "DEFAULT_USER_NAME=%s\n" "$DEFAULT_USER_NAME" >> .env
            printf "DEFAULT_USER_PASSWORD=%s\n" "$DEFAULT_USER_PASSWORD" >> .env
            printf "FIREBASE_PROJECT_ID=%s\n" "$FIREBASE_PROJECT_ID" >> .env
            printf "FIREBASE_PRIVATE_KEY=%s\n" "$FIREBASE_PRIVATE_KEY" >> .env
            printf "FIREBASE_CLIENT_EMAIL=%s\n" "$FIREBASE_CLIENT_EMAIL" >> .env
            printf "RESEND_API_KEY=%s\n" "$RESEND_API_KEY" >> .env
            printf "RESEND_FROM_EMAIL=%s\n" "$RESEND_FROM_EMAIL" >> .env
            printf "JWT_EXPIRES_IN=%s\n" "$JWT_EXPIRES_IN" >> .env
            printf "WAG_SECRET=%s\n" "$WAG_SECRET" >> .env
            printf "WAG_BASE_URL=%s\n" "$WAG_BASE_URL" >> .env
            printf "APP_BASE_URL=%s\n" "$APP_BASE_URL" >> .env
            printf "API_BASE_URL=%s\n" "$API_BASE_URL" >> .env
            printf "APP_URL=%s\n" "$APP_URL" >> .env

            # Escape tanda $ menjadi $$
            sed -i 's/\$/$$/g' .env
            
            chmod 600 .env

            # 2. Registry Login
            export GPG_TTY=$(tty)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 3. Pull Image Terbaru
            docker pull $DOCKER_IMAGE

            # 4. Database Migration & Seeding (Prisma)
            echo "🔄 Running Migrations..."
            docker compose run --rm handlerclaw_api_blue npx prisma migrate deploy
            
            echo "🌱 Seeding Database..."
            docker compose run --rm handlerclaw_api_blue node dist/prisma/seed.js

            # 5. Update Green Instance
            echo "🚀 Starting handlerclaw_api_green..."
            docker compose up -d handlerclaw_api_green

            # 6. Strict Health Check Loop
            echo "🔍 Verifying handlerclaw_api_green health..."
            count=0
            while [ "$(docker inspect --format='{{.State.Health.Status}}' handlerclaw-api-green)" != "healthy" ]; do
              if [ $count -gt 20 ]; then
                echo "❌ Deployment Failed: Green instance is unhealthy."
                docker compose stop handlerclaw_api_green
                exit 1
              fi
              echo "⏳ Waiting for health check... ($((count*5))s)"
              sleep 5
              count=$((count+1))
            done

            # 7. Update Blue Instance
            echo "✅ Green is healthy! Updating handlerclaw_api_blue..."
            docker compose up -d handlerclaw_api_blue

            # 8. Reload Nginx Proxy
            echo "🔄 Reloading Nginx Proxy..."
            docker exec proxy-nginx nginx -s reload

            # 9. Final Cleanup & Logout
            docker image prune -f
            docker logout ghcr.io
            echo "🎉 Deployment Successful"