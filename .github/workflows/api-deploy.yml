name: Build and Deploy API

on:
  push:
    branches:
      - development
    paths:
      - 'api/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose File to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'api/docker-compose.yml'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEFAULT_USER_EMAIL: ${{ secrets.DEFAULT_USER_EMAIL }}
          DEFAULT_USER_NAME: ${{ vars.DEFAULT_USER_NAME || 'Administrator' }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: JWT_SECRET,DATABASE_URL,DB_PASSWORD,DOCKER_IMAGE,DEFAULT_USER_EMAIL,DEFAULT_USER_NAME,DEFAULT_USER_PASSWORD
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. Create .env.production secara aman (Anti-Korupsi karakter $)
            cat <<'EOF' > .env.production
            INSTANCE_NAME=mura-vps
            NODE_ENV=production
            APP_PORT=${{ vars.APP_PORT || '3000' }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
            DOCS_USERNAME=${{ vars.DOCS_USERNAME || 'admin' }}
            DB_HOST=db
            DB_PORT=5432
            EOF

            # Injeksi variabel dinamis
            printf "DOCS_PASSWORD=%s\n" "${{ secrets.DOCS_PASSWORD }}" >> .env.production
            printf "DOCKER_IMAGE=%s\n" "$DOCKER_IMAGE" >> .env.production
            printf "JWT_SECRET=%s\n" "$JWT_SECRET" >> .env.production
            printf "DATABASE_URL=%s\n" "$DATABASE_URL" >> .env.production
            printf "POSTGRES_USER=%s\n" "${{ vars.DB_USER }}" >> .env.production
            printf "POSTGRES_PASSWORD=%s\n" "$DB_PASSWORD" >> .env.production
            printf "POSTGRES_DB=%s\n" "${{ vars.DB_NAME }}" >> .env.production
            printf "DEFAULT_USER_EMAIL=%s\n" "$DEFAULT_USER_EMAIL" >> .env.production
            printf "DEFAULT_USER_NAME=%s\n" "$DEFAULT_USER_NAME" >> .env.production
            printf "DEFAULT_USER_PASSWORD=%s\n" "$DEFAULT_USER_PASSWORD" >> .env.production

            # Escape tanda $ menjadi $$
            sed -i 's/\$/$$/g' .env.production
            
            chmod 600 .env.production

            # 2. Registry Login
            export GPG_TTY=$(tty)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 3. Pull Image Terbaru
            docker pull $DOCKER_IMAGE

            # 4. Database Migration & Seeding (Prisma)
            echo "🔄 Running Migrations..."
            docker compose --env-file .env.production run --rm handler_claw_api_blue npx prisma migrate deploy
            
            echo "🌱 Seeding Database..."
            docker compose --env-file .env.production run --rm handler_claw_api_blue node dist/prisma/seed.js

            # 5. Update Green Instance
            echo "🚀 Starting handler_claw_api_green..."
            docker compose --env-file .env.production up -d handler_claw_api_green

            # 6. Strict Health Check Loop
            echo "🔍 Verifying handler_claw_api_green health..."
            count=0
            while [ "$(docker inspect --format='{{.State.Health.Status}}' handler-claw-api-green)" != "healthy" ]; do
              if [ $count -gt 20 ]; then
                echo "❌ Deployment Failed: Green instance is unhealthy."
                docker compose --env-file .env.production stop handler_claw_api_green
                exit 1
              fi
              echo "⏳ Waiting for health check... ($((count*5))s)"
              sleep 5
              count=$((count+1))
            done

            # 7. Update Blue Instance
            echo "✅ Green is healthy! Updating handler_claw_api_blue..."
            docker compose --env-file .env.production up -d handler_claw_api_blue

            # 8. Reload Nginx Proxy
            echo "🔄 Reloading Nginx Proxy..."
            docker exec proxy-nginx nginx -s reload

            # 9. Final Cleanup & Logout
            docker image prune -f
            docker logout ghcr.io
            echo "🎉 Deployment Successful"