name: Build & Distribute Android (APK)

on:
  push:
    branches:
      - development
    paths:
      - 'handlerclaw/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Get Dependencies
        working-directory: handlerclaw
        run: flutter pub get

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > handlerclaw/android/app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > handlerclaw/android/app/handlerclaw-new-release.jks

      - name: Create key.properties
        run: |
          cat > handlerclaw/android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=handlerclaw-new-release.jks
          EOF

      - name: Build Release APK
        working-directory: handlerclaw
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=APP_BASE_URL=${{ vars.APP_BASE_URL }} \
            --dart-define=SHOW_DEBUG_PAGE=false

      - name: Distribute to Firebase App Distribution
        run: |
          npm install -g firebase-tools
          
          NOW=$(TZ='Asia/Jakarta' date +'%d/%m/%Y %H:%M')
          
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json
          
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          
          firebase appdistribution:distribute handlerclaw/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ vars.FIREBASE_APP_ID }}" \
            --groups "${{ vars.FIREBASE_GROUP }}" \
            --release-notes "Build SHA ${{ github.sha }} - Automated distribution via GitHub Actions ($NOW)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: handlerclaw/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
