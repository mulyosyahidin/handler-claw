services:
  postgres:
    image: postgres:17-alpine
    container_name: db_handler_claw
    environment:
      POSTGRES_USER: uclaw
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_handler_claw
      POSTGRES_SCHEMA: public
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U uclaw -d db_handler_claw && PGPASSWORD=password psql -U uclaw -d db_handler_claw -c 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
